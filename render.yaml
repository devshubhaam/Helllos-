services:
  - type: web
    name: telegram-course-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: FAM_API_KEY
        sync: false
      - key: ADMIN_ID
        sync: false
