services:
  - type: web
    name: telegram-course-bot
    runtime: python
    plan: free            # 24x7 chalane ke liye "starter" + type: worker use karo
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: FAM_API_KEY
        sync: false
